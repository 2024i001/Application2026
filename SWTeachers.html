<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒面接サポートポータル【先生用】</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRコード生成ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .exam-active { font-weight: bold; color: #0f172a; }
        .exam-finished { font-weight: normal; color: #64748b; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10 flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-slate-900 text-white py-3 px-4 shadow-md text-center">
        <h1 class="text-lg font-bold tracking-wide flex items-center justify-center gap-2">
            <span>🎓 生徒面接サポートポータル【先生用】</span>
        </h1>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-1">

        <!-- タブコントロール -->
        <div class="flex p-1.5 bg-slate-200/80 rounded-xl mb-6 shadow-inner max-w-md mx-auto">
            <button id="tab-btn-summary" onclick="switchTab('summary')" 
                    class="flex-1 py-2.5 px-3 rounded-lg font-bold text-sm text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
                <span>📊 面接回数・履歴一覧</span>
            </button>
            <button id="tab-btn-qrcode" onclick="switchTab('qrcode')" 
                    class="flex-1 py-2.5 px-3 rounded-lg font-semibold text-sm text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center justify-center gap-2">
                <span>📱 承認用QRコード表示</span>
            </button>
        </div>

        <!-- ====================================================
             TAB 1: 面接回数・履歴一覧
        ==================================================== -->
        <div id="panel-summary" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-4 border-slate-100">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">面接練習実施状況一覧</h2>
                    <p class="text-xs text-slate-500">生徒ごとの面接回数と試験日程を確認できます。名前をクリックすると詳細履歴を表示します。</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="refreshData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors flex items-center gap-1 border border-slate-300">
                        <span>🔄</span> 最新状態に更新
                    </button>
                    <span id="updateTime" class="text-xs text-slate-400">更新中...</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：一覧テーブル -->
                <div class="lg:col-span-2 space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-bold text-slate-600">並び順:</label>
                            <select id="sortSelect" onchange="renderSummary()" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-medium focus:ring-2 focus:ring-indigo-500">
                                <option value="id-asc">生徒ID順（昇順）</option>
                                <option value="id-desc">生徒ID順（降順）</option>
                                <option value="count-desc">面接回数順（多い順）</option>
                                <option value="count-asc">面接回数順（少ない順）</option>
                                <option value="exam-asc">試験日順（近い順）</option>
                                <option value="exam-desc">試験日順（遠い順）</option>
                            </select>
                        </div>
                        <input type="text" id="searchInput" oninput="renderSummary()" placeholder="生徒名・IDで絞り込み..." class="text-xs border border-slate-300 rounded-lg px-3 py-1.5 w-48 focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="overflow-x-auto border border-slate-200 rounded-xl max-h-[550px]">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 sticky top-0">
                                <tr>
                                    <th class="py-2.5 px-3 text-center w-36">試験日</th>
                                    <th class="py-2.5 px-3">生徒名 / ID</th>
                                    <th class="py-2.5 px-3 text-center w-24">面接回数</th>
                                </tr>
                            </thead>
                            <tbody id="summaryBody" class="divide-y divide-slate-100 bg-white">
                                <tr><td colspan="3" class="py-8 text-center text-slate-400">データを読み込んでいます...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 右側：詳細履歴エリア -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 h-fit">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-2 border-slate-200">
                        <span>📜</span> 個別面接履歴
                    </h3>
                    <div id="historyArea" class="text-xs text-slate-500 min-h-[200px]">
                        一覧から生徒の名前をクリックすると、ここに面接実施履歴が表示されます。
                    </div>
                </div>
            </div>
        </div>

        <!-- ====================================================
             TAB 2: 生徒提示用 承認QRコード表示
        ==================================================== -->
        <div id="panel-qrcode" class="hidden max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-1">先生承認用 QRコード</h2>
                <p class="text-xs text-slate-500">生徒がスマホで面接完了記録を送る際、この画面を提示してカメラで読み取らせてください。</p>
            </div>

            <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center space-y-3">
                <div id="qrcode" class="p-4 bg-white rounded-2xl shadow-md border border-slate-100"></div>
                <p class="text-xs text-slate-400 font-mono" id="qrCodeText"></p>
            </div>

            <p class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 p-3 rounded-xl font-medium">
                💡 短い承認コードで生成されているため、暗い場所や遠くからでも素早くスキャンできます。
            </p>
        </div>

    </main>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzTjAqp9fhtXn56ZbB3QLWUrUAife7Jaz6A4xHmnwRamA7d23lo6loiiHMdaeubz8bP/exec";
        
        // ★生徒側に読み取らせるシンプルな認証テキスト
        const TEACHER_QR_TARGET = "TEACHER_OK";

        let studentsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadSummary();
            initQRCode();
        });

        // ----------------------------------------------------
        // 承認用QRコード生成（高精度・高速読み取り用）
        // ----------------------------------------------------
        function initQRCode() {
            document.getElementById("qrCodeText").textContent = `CODE: ${TEACHER_QR_TARGET}`;
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: TEACHER_QR_TARGET,
                width: 220,
                height: 220,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        // ----------------------------------------------------
        // タブ切り替え
        // ----------------------------------------------------
        function switchTab(target) {
            const btnSummary = document.getElementById('tab-btn-summary');
            const btnQrcode = document.getElementById('tab-btn-qrcode');

            const panelSummary = document.getElementById('panel-summary');
            const panelQrcode = document.getElementById('panel-qrcode');

            const activeClass = "flex-1 py-2.5 px-3 rounded-lg font-bold text-sm text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
            const inactiveClass = "flex-1 py-2.5 px-3 rounded-lg font-semibold text-sm text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center justify-center gap-2";

            panelSummary.classList.add('hidden');
            panelQrcode.classList.add('hidden');

            btnSummary.className = inactiveClass;
            btnQrcode.className = inactiveClass;

            if (target === 'summary') {
                panelSummary.classList.remove('hidden');
                btnSummary.className = activeClass;
                loadSummary();
            } else if (target === 'qrcode') {
                panelQrcode.classList.remove('hidden');
                btnQrcode.className = activeClass;
            }
        }

        // ----------------------------------------------------
        // 集計・履歴表示ロジック
        // ----------------------------------------------------
        async function loadSummary() {
            try {
                const summaryRes = await fetch(GAS_WEB_APP_URL + "?mode=summary");
                const summaryData = await summaryRes.json();

                const examRes = await fetch(GAS_WEB_APP_URL + "?mode=examDates");
                const examData = await examRes.json();

                studentsData = [];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                for (const studentName in summaryData) {
                    const match = studentName.match(/\d+[a-zA-Z]\d+/);
                    const studentId = match ? match[0] : studentName;
                    const displayName = studentName.replace(studentId, "").trim() || studentName;

                    const examList = (examData[studentId] || []).filter(d => d && String(d).trim() !== "");

                    const parsedExamDates = examList.map((dateText, idx) => {
                        const parts = String(dateText).split("/");
                        if (parts.length !== 3) {
                            return { text: dateText, date: null, daysUntil: null, originalIndex: idx };
                        }
                        const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
                        const examDate = new Date(y, m - 1, d);
                        examDate.setHours(0, 0, 0, 0);
                        const daysUntil = Math.floor((examDate - today) / (1000 * 60 * 60 * 24));

                        return {
                            text: `${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`,
                            date: examDate,
                            daysUntil: daysUntil,
                            originalIndex: idx
                        };
                    });

                    studentsData.push({
                        fullName: studentName,
                        name: displayName,
                        id: studentId,
                        count: Number(summaryData[studentName]) || 0,
                        examDates: parsedExamDates
                    });
                }

                renderSummary();
                document.getElementById("updateTime").textContent = "最終更新: " + new Date().toLocaleTimeString("ja-JP");
            } catch (err) {
                console.error("集計データ読み込みエラー:", err);
                document.getElementById("summaryBody").innerHTML = `<tr><td colspan="3" class="py-6 text-center text-red-500">データ取得に失敗しました。</td></tr>`;
            }
        }

        function renderSummary() {
            const sortType = document.getElementById("sortSelect").value;
            const filterKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
            const tbody = document.getElementById("summaryBody");
            tbody.innerHTML = "";

            let filtered = studentsData.filter(s => 
                s.fullName.toLowerCase().includes(filterKeyword) || s.id.toLowerCase().includes(filterKeyword)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-slate-400">該当する生徒が見つかりません。</td></tr>`;
                return;
            }

            if (sortType === "id-asc") {
                filtered.sort((a, b) => compareId(a.id, b.id));
            } else if (sortType === "id-desc") {
                filtered.sort((a, b) => compareId(b.id, a.id));
            } else if (sortType === "count-desc") {
                filtered.sort((a, b) => b.count - a.count || compareId(a.id, b.id));
            } else if (sortType === "count-asc") {
                filtered.sort((a, b) => a.count - b.count || compareId(a.id, b.id));
            } else if (sortType === "exam-asc" || sortType === "exam-desc") {
                filtered.sort((a, b) => {
                    const dateA = a.examDates[0]?.date ? a.examDates[0].date.getTime() : 9999999999999;
                    const dateB = b.examDates[0]?.date ? b.examDates[0].date.getTime() : 9999999999999;
                    return sortType === "exam-asc" ? dateA - dateB : dateB - dateA;
                });
            }

            filtered.forEach(student => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";

                const examTd = document.createElement("td");
                examTd.className = "py-2.5 px-3 text-center text-xs";
                if (student.examDates.length === 0) {
                    examTd.innerHTML = `<span class="text-slate-400">未設定</span>`;
                } else {
                    student.examDates.forEach(exam => {
                        const div = document.createElement("div");
                        if (exam.daysUntil !== null && exam.daysUntil < 0) {
                            div.className = "exam-finished";
                            div.innerHTML = `${exam.text} <span class="text-emerald-600">✓</span>`;
                        } else {
                            div.className = "exam-active font-semibold text-slate-700";
                            div.textContent = exam.text;
                        }
                        examTd.appendChild(div);
                    });
                }

                const nameTd = document.createElement("td");
                nameTd.className = "py-2.5 px-3 font-medium";
                nameTd.innerHTML = `
                    <button onclick="showHistory('${student.id}', '${student.fullName}')" class="text-indigo-600 hover:text-indigo-800 hover:underline font-bold text-left">
                        ${student.name} <span class="text-xs text-slate-500 font-normal">(${student.id})</span>
                    </button>
                `;

                const countTd = document.createElement("td");
                countTd.className = "py-2.5 px-3 text-center font-bold";
                countTd.innerHTML = `<span class="inline-block px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full text-xs">${student.count} 回</span>`;

                tr.appendChild(examTd);
                tr.appendChild(nameTd);
                tr.appendChild(countTd);
                tbody.appendChild(tr);
            });
        }

        function compareId(a, b) {
            const matchA = String(a).match(/(\d+)[a-zA-Z](\d+)/);
            const matchB = String(b).match(/(\d+)[a-zA-Z](\d+)/);
            if (!matchA || !matchB) return String(a).localeCompare(String(b), "ja");

            if (matchA[1] !== matchB[1]) return Number(matchA[1]) - Number(matchB[1]);
            return Number(matchA[2]) - Number(matchB[2]);
        }

        async function showHistory(studentId, displayName) {
            const historyArea = document.getElementById("historyArea");
            historyArea.innerHTML = `<p class="text-slate-500 animate-pulse">履歴を取得中...</p>`;

            try {
                const res = await fetch(GAS_WEB_APP_URL + "?mode=history&studentId=" + encodeURIComponent(studentId));
                const data = await res.json();

                if (!data || data.length === 0) {
                    historyArea.innerHTML = `
                        <div class="space-y-1">
                            <p class="font-bold text-slate-800">${displayName}</p>
                            <p class="text-slate-400">面接練習の記録はまだありません。</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <div class="space-y-2">
                        <p class="font-bold text-slate-800 border-b border-slate-200 pb-1">${displayName}</p>
                        <div class="space-y-1.5 max-h-[350px] overflow-y-auto pr-1">
                `;

                data.forEach((item, index) => {
                    let dateText = item.datetime || "";
                    if (dateText) {
                        const d = new Date(dateText);
                        if (!isNaN(d.getTime())) {
                            dateText = d.toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
                        }
                    }
                    html += `
                        <div class="bg-white p-2 rounded-lg border border-slate-200 flex justify-between items-center text-xs shadow-sm">
                            <span class="font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">第${index + 1}回</span>
                            <span class="text-slate-600">${dateText}</span>
                            <span class="font-bold text-slate-800">${item.teacher} 先生</span>
                        </div>
                    `;
                });

                html += `</div></div>`;
                historyArea.innerHTML = html;
            } catch (err) {
                historyArea.innerHTML = `<p class="text-red-500">履歴の取得に失敗しました。</p>`;
            }
        }

        function refreshData() {
            document.getElementById("updateTime").textContent = "更新中...";
            loadSummary();
        }
    </script>
</body>
</html>
