<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒面接サポートポータル【先生用】</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRコード生成ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* タブ非表示クラス */
        .tab-content.hidden { display: none; }

        /* ========================================
           SWinTeacher スタイル
        ======================================== */
        .app2-page-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.35rem;
            font-weight: bold;
            color: #0f172a;
        }
        .app2-container { display: flex; gap: 24px; }
        .app2-left { flex: 1; min-width: 300px; }
        .app2-right { flex: 1; min-width: 300px; }
        .sortArea { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .sortArea select { padding: 5px 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #fff; }
        .sortArea input { padding: 5px 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #fff; }
        .sortArea button { padding: 5px 12px; font-size: 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .sortArea button:hover { background: #e2e8f0; }
        .app2-table { border-collapse: collapse; width: 100%; font-size: 14px; background-color: #ffffff; }
        .app2-table th, .app2-table td { border: 1px solid #cbd5e1; padding: 8px 10px; }
        .app2-table th { background: #f8fafc; font-weight: 600; color: #334155; }
        .student-cell { text-align: center; }
        .student-link { color: #2563eb; cursor: pointer; text-decoration: underline; font-weight: 500; }
        .student-link:hover { color: #1d4ed8; }
        .count-cell { text-align: center; font-weight: 600; }
        .exam-date-cell { text-align: center; }
        .exam-active { font-weight: bold; color: #0f172a; }
        .exam-finished { font-weight: normal; color: #64748b; }
        #updateTime { color: #64748b; font-size: 12px; white-space: nowrap; }
        #historyArea { border: 1px solid #e2e8f0; padding: 12px; min-height: 250px; background: #f8fafc; border-radius: 8px; }
        #historyArea h2 { margin-top: 0; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #0f172a; }

        /* レスポンシブ調整 */
        @media (max-width: 768px) {
            .app2-container { flex-direction: column; }
            .app2-left, .app2-right { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- ヘッダー（SWinTeacherスタイルのスリムヘッダー） -->
    <header class="bg-slate-900 text-white py-2.5 px-4 sm:px-6 shadow-md flex items-center justify-between">
        <h1 class="text-base sm:text-lg font-bold tracking-wide flex items-center gap-2">
            <span>🎓 生徒面接サポートポータル【先生用】</span>
        </h1>
    </header>

    <!-- メイン領域 -->
    <main class="max-w-7xl w-full mx-auto p-3 sm:p-5 flex-1 flex flex-col">

        <!-- SWinTeacherと完全に一致させたセグメントタブコントロール（パネルと隙間なしで接続） -->
        <div class="flex items-center justify-between flex-wrap gap-2 -mb-px relative z-10">
            <div class="inline-flex p-1 bg-slate-200/90 rounded-t-xl text-xs sm:text-sm font-medium">
                <!-- タブ1: 面接回数・履歴一覧 -->
                <button id="tab-btn-summary" onclick="switchTab('summary')" 
                        class="px-4 py-1.5 rounded-lg font-semibold text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center gap-1.5">
                    <span>面接回数・履歴一覧</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-indigo-100 text-indigo-700 rounded-full font-bold">一覧表示</span>
                </button>
                <!-- タブ2: 承認用QRコード表示 -->
                <button id="tab-btn-qrcode" onclick="switchTab('qrcode')" 
                        class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center gap-1.5">
                    <span>承認用QRコード表示</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full font-medium">QR表示</span>
                </button>
            </div>
        </div>

        <!-- 各表示エリア -->

        <!-- ▼▼▼ TAB 1: 面接回数・履歴一覧（SWinTeacher完全再現レイアウト） ▼▼▼ -->
        <div id="panel-summary" class="tab-content bg-white p-4 sm:p-6 rounded-b-xl rounded-tr-xl border border-slate-200 shadow-sm flex-1">
            <h1 class="app2-page-title">面接練習回数一覧</h1>

            <div class="app2-container">
                <!-- 左側：一覧テーブル -->
                <div class="app2-left">
                    <div class="sortArea">
                        <select id="sortSelect" onchange="renderSummary()">
                            <option value="id-asc">生徒ID順（昇順）</option>
                            <option value="id-desc">生徒ID順（降順）</option>
                            <option value="count-desc">面接回数順（多い順）</option>
                            <option value="count-asc">面接回数順（少ない順）</option>
                            <option value="exam-asc">試験日順（近い順）</option>
                            <option value="exam-desc">試験日順（遠い順）</option>
                        </select>
                        <input type="text" id="searchInput" oninput="renderSummary()" placeholder="生徒名・IDで絞り込み...">
                        <button onclick="refreshData()">🔄 更新</button>
                        <span id="updateTime">更新中...</span>
                    </div>

                    <table class="app2-table">
                        <thead>
                            <tr>
                                <th>試験日</th>
                                <th>生徒名 / ID</th>
                                <th>面接回数</th>
                            </tr>
                        </thead>
                        <tbody id="summaryBody">
                            <tr><td colspan="3" class="text-center py-4 text-slate-400">データを読み込んでいます...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- 右側：詳細履歴 -->
                <div class="app2-right">
                    <h2>面接履歴</h2>
                    <div id="historyArea">生徒IDをクリックしてください。</div>
                </div>
            </div>
        </div>
        <!-- ▲▲▲ TAB 1 終了 ▲▲▲ -->

        <!-- ▼▼▼ TAB 2: 生徒提示用 承認QRコード表示 ▼▼▼ -->
        <div id="panel-qrcode" class="tab-content hidden bg-white p-4 sm:p-6 rounded-b-xl rounded-tr-xl border border-slate-200 shadow-sm flex-1">
            <div class="max-w-md mx-auto text-center space-y-4 py-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 mb-1">先生承認用 QRコード</h2>
                    <p class="text-xs text-slate-500">生徒がスマホで面接完了記録を送る際、この画面を提示してカメラで読み取らせてください。</p>
                </div>

                <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center space-y-3">
                    <div id="qrcode" class="p-4 bg-white rounded-2xl shadow-md border border-slate-100"></div>
                    <p class="text-xs text-slate-400 font-mono" id="qrCodeText"></p>
                </div>

                <p class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 p-3 rounded-xl font-medium">
                    💡 短い承認コードで生成されているため、暗い場所や遠くからでも素早くスキャンできます。
                </p>
            </div>
        </div>
        <!-- ▲▲▲ TAB 2 終了 ▲▲▲ -->

    </main>

    <!-- JavaScript -->
    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzTjAqp9fhtXn56ZbB3QLWUrUAife7Jaz6A4xHmnwRamA7d23lo6loiiHMdaeubz8bP/exec";
        
        // ★生徒側に読み取らせるシンプルな認証テキスト
        const TEACHER_QR_TARGET = "TEACHER_OK";

        let studentsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadSummary();
            initQRCode();
        });

        // ----------------------------------------------------
        // 承認用QRコード生成
        // ----------------------------------------------------
        function initQRCode() {
            document.getElementById("qrCodeText").textContent = `CODE: ${TEACHER_QR_TARGET}`;
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: TEACHER_QR_TARGET,
                width: 220,
                height: 220,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        // ----------------------------------------------------
        // タブ切り替え（SWinTeacherスタイルのアクティブ・非アクティブクラス切り替え）
        // ----------------------------------------------------
        function switchTab(target) {
            const btnSummary = document.getElementById('tab-btn-summary');
            const btnQrcode = document.getElementById('tab-btn-qrcode');

            const panelSummary = document.getElementById('panel-summary');
            const panelQrcode = document.getElementById('panel-qrcode');

            const activeClass = "px-4 py-1.5 rounded-lg font-semibold text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center gap-1.5";
            const inactiveClass = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center gap-1.5";

            panelSummary.classList.add('hidden');
            panelQrcode.classList.add('hidden');

            btnSummary.className = inactiveClass;
            btnQrcode.className = inactiveClass;

            if (target === 'summary') {
                panelSummary.classList.remove('hidden');
                btnSummary.className = activeClass;
                loadSummary();
            } else if (target === 'qrcode') {
                panelQrcode.classList.remove('hidden');
                btnQrcode.className = activeClass;
            }
        }

        // ----------------------------------------------------
        // 集計・履歴表示ロジック
        // ----------------------------------------------------
        async function loadSummary() {
            try {
                const summaryRes = await fetch(GAS_WEB_APP_URL + "?mode=summary");
                const summaryData = await summaryRes.json();

                const examRes = await fetch(GAS_WEB_APP_URL + "?mode=examDates");
                const examData = await examRes.json();

                studentsData = [];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                for (const studentName in summaryData) {
                    const match = studentName.match(/\d+[a-zA-Z]\d+/);
                    const studentId = match ? match[0] : studentName;
                    const displayName = studentName.replace(studentId, "").trim() || studentName;

                    const examList = (examData[studentId] || []).filter(d => d && String(d).trim() !== "");

                    const parsedExamDates = examList.map((dateText, idx) => {
                        const parts = String(dateText).split("/");
                        if (parts.length !== 3) {
                            return { text: dateText, date: null, daysUntil: null, originalIndex: idx };
                        }
                        const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
                        const examDate = new Date(y, m - 1, d);
                        examDate.setHours(0, 0, 0, 0);
                        const daysUntil = Math.floor((examDate - today) / (1000 * 60 * 60 * 24));

                        return {
                            text: `${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`,
                            date: examDate,
                            daysUntil: daysUntil,
                            originalIndex: idx
                        };
                    });

                    studentsData.push({
                        fullName: studentName,
                        name: displayName,
                        id: studentId,
                        count: Number(summaryData[studentName]) || 0,
                        examDates: parsedExamDates
                    });
                }

                renderSummary();
                document.getElementById("updateTime").textContent = "最終更新: " + new Date().toLocaleTimeString("ja-JP");
            } catch (err) {
                console.error("集計データ読み込みエラー:", err);
                document.getElementById("summaryBody").innerHTML = `<tr><td colspan="3" class="text-center py-4 text-red-500">データ取得に失敗しました。</td></tr>`;
            }
        }

        function renderSummary() {
            const sortType = document.getElementById("sortSelect").value;
            const filterKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
            const tbody = document.getElementById("summaryBody");
            tbody.innerHTML = "";

            let filtered = studentsData.filter(s => 
                s.fullName.toLowerCase().includes(filterKeyword) || s.id.toLowerCase().includes(filterKeyword)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400">該当する生徒が見つかりません。</td></tr>`;
                return;
            }

            if (sortType === "id-asc") {
                filtered.sort((a, b) => compareId(a.id, b.id));
            } else if (sortType === "id-desc") {
                filtered.sort((a, b) => compareId(b.id, a.id));
            } else if (sortType === "count-desc") {
                filtered.sort((a, b) => b.count - a.count || compareId(a.id, b.id));
            } else if (sortType === "count-asc") {
                filtered.sort((a, b) => a.count - b.count || compareId(a.id, b.id));
            } else if (sortType === "exam-asc" || sortType === "exam-desc") {
                filtered.sort((a, b) => {
                    const dateA = a.examDates[0]?.date ? a.examDates[0].date.getTime() : 9999999999999;
                    const dateB = b.examDates[0]?.date ? b.examDates[0].date.getTime() : 9999999999999;
                    return sortType === "exam-asc" ? dateA - dateB : dateB - dateA;
                });
            }

            filtered.forEach(student => {
                const tr = document.createElement("tr");

                const examTd = document.createElement("td");
                examTd.className = "exam-date-cell";
                if (student.examDates.length === 0) {
                    examTd.textContent = "未設定";
                } else {
                    student.examDates.forEach(exam => {
                        const div = document.createElement("div");
                        if (exam.daysUntil !== null && exam.daysUntil < 0) {
                            div.className = "exam-finished";
                            div.textContent = exam.text + " ✅";
                        } else {
                            div.className = "exam-active";
                            div.textContent = exam.text;
                        }
                        examTd.appendChild(div);
                    });
                }

                const nameTd = document.createElement("td");
                nameTd.className = "student-cell";
                const studentLink = document.createElement("span");
                studentLink.className = "student-link";
                studentLink.textContent = student.name + " " + student.id;
                studentLink.onclick = function() {
                    showHistory(student.id, student.name + " " + student.id);
                };
                nameTd.appendChild(studentLink);

                const countTd = document.createElement("td");
                countTd.className = "count-cell";
                countTd.textContent = student.count + "回";

                tr.appendChild(examTd);
                tr.appendChild(nameTd);
                tr.appendChild(countTd);
                tbody.appendChild(tr);
            });
        }

        function compareId(a, b) {
            const matchA = String(a).match(/(\d+)[a-zA-Z](\d+)/);
            const matchB = String(b).match(/(\d+)[a-zA-Z](\d+)/);
            if (!matchA || !matchB) return String(a).localeCompare(String(b), "ja");

            if (matchA[1] !== matchB[1]) return Number(matchA[1]) - Number(matchB[1]);
            return Number(matchA[2]) - Number(matchB[2]);
        }

        async function showHistory(studentId, displayName) {
            const historyArea = document.getElementById("historyArea");
            historyArea.innerHTML = "<p>読み込み中...</p>";

            try {
                const res = await fetch(GAS_WEB_APP_URL + "?mode=history&studentId=" + encodeURIComponent(studentId));
                const data = await res.json();

                if (!data || data.length === 0) {
                    historyArea.innerHTML = "<h2>" + displayName + " の面接履歴</h2><p>面接履歴はありません。</p>";
                    return;
                }

                let html = "<h2>" + displayName + " の面接履歴</h2>";
                html += "<table class='app2-table'>";
                html += "<thead><tr><th>回数</th><th>日時</th><th>担当先生</th></tr></thead><tbody>";

                data.forEach((item, index) => {
                    let dateText = item.datetime || item.dateTime || item.timestamp || "";
                    if (dateText) {
                        const d = new Date(dateText);
                        if (!isNaN(d.getTime())) {
                            dateText = d.toLocaleString("ja-JP");
                        }
                    }
                    const teacher = item.teacher || item.teacherName || "";
                    html += "<tr><td>" + (index + 1) + "回目</td><td>" + dateText + "</td><td>" + teacher + "</td></tr>";
                });

                html += "</tbody></table>";
                historyArea.innerHTML = html;
            } catch (err) {
                console.error(err);
                historyArea.innerHTML = "<p>履歴の取得に失敗しました。</p>";
            }
        }

        function refreshData() {
            document.getElementById("updateTime").textContent = "更新中...";
            loadSummary();
        }
    </script>
</body>
</html>
