<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒面接サポートポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

    <!-- 生徒ID予測変換用の共通データリスト -->
    <datalist id="studentListOptions"></datalist>

    <!-- ====================================================
         最終確認ポップアップ (画面上部からのモーダル)
    ==================================================== -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-8 sm:pt-16 px-4 transition-all">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full p-6 space-y-5 animate-slide-down">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="text-xl">📋</span> 送信内容の最終確認
                </h3>
                <button onclick="closeConfirmModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm">
                <div class="flex justify-between items-center border-b pb-2 border-slate-200">
                    <span class="text-slate-500 font-medium">学科</span>
                    <span id="modalDept" class="font-bold text-slate-800"></span>
                </div>
                <div class="flex justify-between items-center border-b pb-2 border-slate-200">
                    <span class="text-slate-500 font-medium">担当の先生</span>
                    <span id="modalTeacher" class="font-bold text-slate-800"></span>
                </div>
                <div class="flex justify-between items-center border-b pb-2 border-slate-200">
                    <span class="text-slate-500 font-medium">生徒氏名 / ID</span>
                    <span id="modalStudent" class="font-bold text-indigo-700"></span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-slate-500 font-medium">先生承認QR</span>
                    <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                        ✓ 認証成功
                    </span>
                </div>
            </div>

            <p class="text-xs text-slate-500 text-center">上記の内容で面接練習記録を確定します。よろしいですか？</p>

            <div class="flex gap-3 pt-1">
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors">
                    やり直す
                </button>
                <button onclick="executeSubmit()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-colors flex items-center justify-center gap-1">
                    <span>確定して送信</span>
                </button>
            </div>
        </div>
    </div>


    <header class="bg-indigo-900 text-white py-3 px-4 shadow-md text-center">
        <h1 class="text-lg font-bold tracking-wide">生徒面接サポートポータル</h1>
    </header>

    <main class="max-w-3xl mx-auto p-4 sm:p-6">

        <!-- セグメントタブコントロール -->
        <div class="flex p-1.5 bg-slate-200/80 rounded-xl mb-6 shadow-inner">
            <button id="tab-btn-record" onclick="switchTab('record')" 
                    class="flex-1 py-2.5 px-3 rounded-lg font-bold text-sm text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
                <span>📝 面接完了記録（QR）</span>
            </button>
            <button id="tab-btn-schedule" onclick="switchTab('schedule')" 
                    class="flex-1 py-2.5 px-3 rounded-lg font-semibold text-sm text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center justify-center gap-2">
                <span>📅 面接本番スケジュール</span>
            </button>
        </div>


        <!-- TAB 1: 面接練習記録（先生のQR承認機能） -->
        <div id="panel-record" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-5">
            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-1">面接練習の完了記録</h2>
                <p class="text-xs text-slate-500">面接練習が終わったら、必要事項を入力の上、先生のQRコードを読み取ってください。</p>
            </div>

            <div class="space-y-4 pt-2">
                <!-- 学科選択 -->
                <div>
                    <label for="department" class="block text-sm font-semibold text-slate-700 mb-1">① 学科を選択してください</label>
                    <select id="department" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white font-medium focus:ring-2 focus:ring-indigo-500">
                        <option value="未選択">読み込み中...</option>
                    </select>
                </div>

                <!-- 先生選択 -->
                <div>
                    <label for="teacher" class="block text-sm font-semibold text-slate-700 mb-1">② 面接を担当した先生を選択してください</label>
                    <select id="teacher" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50 font-medium text-slate-500" disabled>
                        <option value="未選択">-- 先に学科を選択してください --</option>
                    </select>
                </div>

                <!-- 生徒ID入力（予測変換・補正対応） -->
                <div>
                    <label for="studentIdRecord" class="block text-sm font-semibold text-slate-700 mb-1">③ あなたの氏名・生徒ID</label>
                    <input type="text" id="studentIdRecord" list="studentListOptions" onblur="autoResolveInput('studentIdRecord')" placeholder="名前またはIDを入力（出席番号2桁でも検索可）" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-slate-500 mt-1">※名前を入力すると予測変換が出ます。</p>
                </div>

                <!-- QR読み取りボタン -->
                <div class="pt-2">
                    <button id="startScanBtn" onclick="toggleCamera()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                        <span>先生のQRコードを読み取って確認送信</span>
                    </button>
                </div>

                <!-- カメラ表示エリア -->
                <div id="cameraContainer" class="hidden text-center space-y-2 mt-4 p-4 bg-slate-50 rounded-lg border border-slate-200">
                    <p class="text-sm font-bold text-indigo-700">先生が持っている承認用QRコードをカメラにかざしてください</p>
                    <canvas id="canvas" class="w-full max-w-sm mx-auto border-2 border-indigo-500 rounded-lg bg-black"></canvas>
                </div>

                <!-- 結果メッセージ -->
                <div id="recordResult" class="hidden p-4 rounded-lg text-sm font-bold"></div>
            </div>
        </div>


        <!-- TAB 2: 面接本番スケジュール登録＆カレンダー -->
        <div id="panel-schedule" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-1">面接本番スケジュールの登録</h2>
                <p class="text-xs text-slate-500">受験する面接の本番日時を登録します。</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">氏名・生徒ID</label>
                    <input type="text" id="candidateName" list="studentListOptions" onblur="autoResolveInput('candidateName')" placeholder="名前またはIDを入力" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">面接本番日時</label>
                    <input type="datetime-local" id="interviewDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="button" id="submitDateBtn" onclick="addScheduleEvent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition-colors">
                    カレンダー＆スプレッドシートに登録
                </button>
            </div>

            <!-- カレンダー -->
            <div class="mt-6 border border-slate-200 rounded-lg p-2 bg-white">
                <div id="calendar"></div>
            </div>
        </div>

    </main>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzTjAqp9fhtXn56ZbB3QLWUrUAife7Jaz6A4xHmnwRamA7d23lo6loiiHMdaeubz8bP/exec";
        
        // 新しい先生用QRコードの完全一致判定用文字列
        const TEACHER_QR_TARGET = "https://2024i001.github.io/Application2026/supersecrethypertextmarkuplanguage.html";

        let masterStudentList = []; // 生徒マスター（氏名+ID）配列
        let teacherDataMap = {};
        let isCameraRunning = false;
        let localStream = null;
        let animationFrameId = null;
        let video = document.createElement("video");
        let calendar;

        // 一時保留用の送信データ
        let pendingSubmission = null;

        document.addEventListener('DOMContentLoaded', async () => {
            loadTeachers();
            fetchStudentMaster();
            initCalendar();

            // 学科選択連動
            document.getElementById("department").addEventListener("change", function() {
                const selectedDept = this.value;
                const teacherSelect = document.getElementById("teacher");
                teacherSelect.innerHTML = "";

                if (selectedDept === "未選択" || !teacherDataMap[selectedDept]) {
                    teacherSelect.innerHTML = '<option value="未選択">-- 先に学科を選択してください --</option>';
                    teacherSelect.disabled = true;
                    teacherSelect.className = "w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50 font-medium text-slate-500";
                } else {
                    teacherSelect.innerHTML = '<option value="未選択">-- 先生を選択してください --</option>';
                    teacherDataMap[selectedDept].forEach(teacher => {
                        const opt = document.createElement("option");
                        opt.value = teacher;
                        opt.textContent = teacher;
                        teacherSelect.appendChild(opt);
                    });
                    teacherSelect.disabled = false;
                    teacherSelect.className = "w-full px-3 py-2 border border-slate-300 rounded-lg bg-white font-medium focus:ring-2 focus:ring-indigo-500";
                }
            });
        });

        // ----------------------------------------------------
        // 生徒マスター取得＆予測変換datalist構築
        // ----------------------------------------------------
        async function fetchStudentMaster() {
            try {
                const res = await fetch(GAS_WEB_APP_URL + "?mode=students");
                if (res.ok) {
                    const list = await res.json();
                    if (Array.isArray(list)) {
                        masterStudentList = list;
                        const datalist = document.getElementById('studentListOptions');
                        datalist.innerHTML = '';
                        list.forEach(item => {
                            const option = document.createElement('option');
                            option.value = item;
                            datalist.appendChild(option);
                        });
                    }
                }
            } catch (err) {
                console.warn("マスターデータ取得エラー:", err);
            }
        }

        // 名前入力をマスターの「名前+ID」の形に判定・変換する補正ロジック
        function resolveStudentId(inputText) {
            const query = inputText.trim();
            if (!query) return '';

            const exactMatch = masterStudentList.find(item => item === query);
            if (exactMatch) return exactMatch;

            const clean = (str) => str.replace(/\s+/g, '').toLowerCase();
            const cleanedQuery = clean(query);

            const spaceIgnoreMatch = masterStudentList.find(item => clean(item) === cleanedQuery);
            if (spaceIgnoreMatch) return spaceIgnoreMatch;

            const startsWithMatch = masterStudentList.find(item => clean(item).startsWith(cleanedQuery));
            if (startsWithMatch) return startsWithMatch;

            const includesMatch = masterStudentList.find(item => clean(item).includes(cleanedQuery));
            if (includesMatch) return includesMatch;

            return query;
        }

        function autoResolveInput(elementId) {
            const inputEl = document.getElementById(elementId);
            if (inputEl && inputEl.value.trim()) {
                inputEl.value = resolveStudentId(inputEl.value);
            }
        }

        // ----------------------------------------------------
        // モーダル（最終確認ポップアップ）制御
        // ----------------------------------------------------
        function openConfirmModal(dept, teacherName, studentId) {
            pendingSubmission = { teacherName, studentId };

            document.getElementById('modalDept').textContent = dept;
            document.getElementById('modalTeacher').textContent = teacherName + " 先生";
            document.getElementById('modalStudent').textContent = studentId;

            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            pendingSubmission = null;
        }

        function executeSubmit() {
            if (!pendingSubmission) return;
            const { teacherName, studentId } = pendingSubmission;
            closeConfirmModal();
            sendInterviewRecord(teacherName, studentId);
        }

        // ----------------------------------------------------
        // タブ切り替え機能
        // ----------------------------------------------------
        function switchTab(target) {
            const btnRecord = document.getElementById('tab-btn-record');
            const btnSchedule = document.getElementById('tab-btn-schedule');
            const panelRecord = document.getElementById('panel-record');
            const panelSchedule = document.getElementById('panel-schedule');

            const activeClass = "flex-1 py-2.5 px-3 rounded-lg font-bold text-sm text-indigo-700 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
            const inactiveClass = "flex-1 py-2.5 px-3 rounded-lg font-semibold text-sm text-slate-600 hover:text-slate-900 transition-all duration-200 flex items-center justify-center gap-2";

            if (target === 'record') {
                panelRecord.classList.remove('hidden');
                panelSchedule.classList.add('hidden');
                btnRecord.className = activeClass;
                btnSchedule.className = inactiveClass;
            } else {
                if (isCameraRunning) stopCamera();

                panelSchedule.classList.remove('hidden');
                panelRecord.classList.add('hidden');
                btnSchedule.className = activeClass;
                btnRecord.className = inactiveClass;

                if (calendar) {
                    setTimeout(() => calendar.updateSize(), 50);
                }
            }
        }

        // ----------------------------------------------------
        // 1. 面接練習記録（先生承認スキャン）機能
        // ----------------------------------------------------
        function loadTeachers() {
            const deptSelect = document.getElementById("department");
            fetch(GAS_WEB_APP_URL + "?mode=teachers")
                .then(res => res.json())
                .then(data => {
                    deptSelect.innerHTML = '<option value="未選択">-- 学科を選択してください --</option>';
                    if (data.teacherMap && Object.keys(data.teacherMap).length > 0) {
                        teacherDataMap = data.teacherMap;
                        Object.keys(data.teacherMap).forEach(dept => {
                            const opt = document.createElement("option");
                            opt.value = dept;
                            opt.textContent = dept;
                            deptSelect.appendChild(opt);
                        });
                    }
                })
                .catch(err => console.error("先生リスト取得失敗:", err));
        }

        function toggleCamera() {
            if (isCameraRunning) {
                stopCamera();
            } else {
                const dept = document.getElementById("department").value;
                const teacherName = document.getElementById("teacher").value;
                const rawStudentId = document.getElementById("studentIdRecord").value.trim();

                if (dept === "未選択" || teacherName === "未選択") {
                    alert("学科と担当の先生を選択してください。");
                    return;
                }
                if (!rawStudentId) {
                    alert("生徒ID（または氏名）を入力してください。");
                    return;
                }

                document.getElementById("studentIdRecord").value = resolveStudentId(rawStudentId);
                startCamera();
            }
        }

        function startCamera() {
            const canvasElement = document.getElementById("canvas");
            const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
            const container = document.getElementById("cameraContainer");
            const startBtn = document.getElementById("startScanBtn");
            const resultDiv = document.getElementById("recordResult");

            container.classList.remove("hidden");
            resultDiv.classList.add("hidden");
            startBtn.innerHTML = "<span>❌ カメラを閉じる</span>";
            startBtn.className = "w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2";
            isCameraRunning = true;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                localStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                animationFrameId = requestAnimationFrame(tick);
            }).catch(err => {
                alert("カメラ起動エラー: " + err.message);
                stopCamera();
            });

            let isProcessing = false;

            function tick() {
                if (!isCameraRunning) return;

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvasElement.height = video.videoHeight;
                    canvasElement.width = video.videoWidth;
                    canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

                    const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                    if (code && !isProcessing) {
                        isProcessing = true;
                        const dept = document.getElementById("department").value;
                        const teacherName = document.getElementById("teacher").value;
                        const studentId = document.getElementById("studentIdRecord").value.trim();

                        const scannedVal = code.data.trim();

                        // 先生用QRコードの完全一致判定
                        if (scannedVal !== TEACHER_QR_TARGET) {
                            resultDiv.className = "p-4 rounded-lg text-sm font-bold bg-red-50 text-red-800 border border-red-300 mt-3";
                            resultDiv.innerText = "❌ 認証エラー: 正しい先生用QRコードではありません。";
                            resultDiv.classList.remove("hidden");

                            setTimeout(() => {
                                isProcessing = false;
                            }, 2000);
                            return;
                        }

                        // 完全一致時：カメラを止め、上部からの確認ポップアップを開く
                        stopCamera();
                        openConfirmModal(dept, teacherName, studentId);
                        return;
                    }
                }
                if (isCameraRunning) {
                    animationFrameId = requestAnimationFrame(tick);
                }
            }
        }

        function stopCamera() {
            isCameraRunning = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById("cameraContainer").classList.add("hidden");
            const startBtn = document.getElementById("startScanBtn");
            startBtn.innerHTML = "<span>先生のQRコードを読み取って確認送信</span>";
            startBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2";
        }

        function sendInterviewRecord(teacherName, studentId) {
            const resultDiv = document.getElementById("recordResult");
            resultDiv.className = "p-4 rounded-lg text-sm font-bold bg-blue-50 text-blue-700 border border-blue-200 mt-3";
            resultDiv.innerText = "送信中...";
            resultDiv.classList.remove("hidden");

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "recordLog", teacherName: teacherName, studentId: studentId })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "Success") {
                    resultDiv.className = "p-4 rounded-lg text-sm font-bold bg-green-50 text-green-800 border border-green-300 mt-3";
                    resultDiv.innerHTML = `✅ 記録完了！<br>生徒名: ${res.name} / 担当: ${teacherName}先生`;
                    document.getElementById("studentIdRecord").value = "";
                } else {
                    resultDiv.className = "p-4 rounded-lg text-sm font-bold bg-red-50 text-red-800 border border-red-300 mt-3";
                    resultDiv.innerText = "エラー: " + res.message;
                }
            })
            .catch(err => {
                resultDiv.className = "p-4 rounded-lg text-sm font-bold bg-red-50 text-red-800 border border-red-300 mt-3";
                resultDiv.innerText = "通信エラー: " + err.message;
            });
        }

        // ----------------------------------------------------
        // 2. 面接本番スケジュール機能
        // ----------------------------------------------------
        function initCalendar() {
            const now = new Date();
            now.setHours(now.getHours() + 1, 0, 0, 0);
            document.getElementById('interviewDate').value = formatDateForInput(now);

            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                buttonText: { today: '今日', month: '月', week: '週' },
                events: []
            });
            calendar.render();
        }

        function formatDateForInput(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d}T${hh}:${mm}`;
        }

        async function addScheduleEvent() {
            const rawInput = document.getElementById('candidateName').value.trim();
            const dateVal = document.getElementById('interviewDate').value;

            if (!rawInput || !dateVal) {
                alert('氏名/生徒IDと日時を入力してください。');
                return;
            }

            const studentId = resolveStudentId(rawInput);
            const btn = document.getElementById('submitDateBtn');
            btn.disabled = true;
            btn.innerText = "登録中...";

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: "recordInterviewDate", studentId: studentId, dateVal: dateVal })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    const start = new Date(dateVal.replace('T', ' '));
                    const end = new Date(start.getTime() + 60 * 60000);
                    calendar.addEvent({ title: studentId, start: start, end: end, allDay: false });

                    alert(`「${studentId}」さんの面接予約を登録しました！`);
                    document.getElementById('candidateName').value = '';
                } else {
                    alert('登録失敗: ' + (result.message || 'エラーが発生しました。'));
                }
            } catch (err) {
                alert('送信エラー: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "カレンダー＆スプレッドシートに登録";
            }
        }
    </script>
</body>
</html>
